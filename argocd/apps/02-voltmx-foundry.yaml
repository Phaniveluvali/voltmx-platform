apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: voltmx-foundry
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Phaniveluvali/voltmx-platform.git
    targetRevision: main
    path: charts/voltmx-foundry
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: voltmx
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
