# Labels for VoltMX Foundry components pods and services
#-------------------------------------------------------------------------------
### Example : Below labels are already defined in component yaml files
    # labels:
      #  app: voltmx-foundry-apiportal
      #  app.kubernetes.io/part-of: voltmx
      #  app.kubernetes.io/component: apiportal
      #  alias: apiportal
      #  app.kubernetes.io/name: {{ include "voltmx.name" . }}
      #  app.kubernetes.io/instance: {{ .Release.Name }}
#-------------------------------------------------------------------------------
# Sample "labels" configuration:
#   labels:
#     pods:
#       console:
#         - key: KEY1
#           value: VALUE1
#         - key: KEY2
#           value: VALUE2
labels:
  pods:
    console:
    identity:
    apiPortal:
    integration:
    engagement:
  services:
    console:
    identity:
    apiPortal:
    integration:
    engagement:

# Annotations for VoltMX Foundry components pods and services
#-------------------------------------------------------------------------------
# Sample "annotations" configuration:
#   labels:
#     pods:
#       console:
#         - key: KEY1
#           value: VALUE1
#         - key: KEY2
#           value: VALUE2
annotations:
  pods:
    console:
    identity:
    apiPortal:
    integration:
    engagement:
  services:
    console:
    identity:
    apiPortal:
    integration:
    engagement:

# nodeName is a field in the Pod spec. If the nodeName field is not empty, the scheduler ignores the Pod and the kubelet on the named node tries to place the Pod on that node.
# e.g nodeName
# nodeName:
#   console: "node-0"
nodeName:
  console: ""
  identity: ""
  apiPortal: ""
  integration: ""
  engagement: ""

# Tolerations are applied to pods. Tolerations allow the scheduler to schedule pods with matching taints.
# e.g tolerations
# tolerations:
#   console:
#   - key: "key1"
#     operator: "Equal"
#     value: "value1"
#     effect: "NoSchedule"
tolerations:
  console:
  identity:
  apiPortal:
  integration:
  engagement:

# You can use topology spread constraints to control how Pods are spread across your cluster among failure-domains such as regions, zones, nodes, or among any other topology domains that you define.
# e.g topologySpreadConstraints:
# topologySpreadConstraints:
#   console:
#   - maxSkew: 1
#     topologyKey: zone
#     whenUnsatisfiable: DoNotSchedule #ScheduleAnyway
#     labelSelector:
#       matchLabels:
#         app: voltmx-foundry-console
topologySpreadConstraints:
  console:
  identity:
  apiPortal:
  integration:
  engagement:

# Affinity and anti-affinity expands the types of constraints you can define
affinity:
  console:
    podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - voltmx-foundry-console
                topologyKey: "kubernetes.io/hostname"
  identity:
    podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - voltmx-foundry-identity
                topologyKey: "kubernetes.io/hostname"
  apiPortal:
    podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - voltmx-foundry-apiportal
                topologyKey: "kubernetes.io/hostname"
  integration:
    podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - voltmx-foundry-integration
                topologyKey: "kubernetes.io/hostname"
  engagement:
    podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - voltmx-foundry-engagement
                topologyKey: "kubernetes.io/hostname"
