apiVersion: v1
kind: Secret
metadata:
  name: foundry-db-secrets
  labels:
    app.kubernetes.io/part-of: voltmx
    app.kubernetes.io/component: dbupdate
    alias: dbupdate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,post-install
data:
# Provide the various passwords required for the Foundry install
  DB_PASS: {{ .Values.dbPass | b64enc | quote }}
  DB_PASS_SECRET_KEY: {{ .Values.dbPassSecretKey | b64enc | quote }}
  KONY_SERVER_STORAGE_DATABASE_PASSWORD: {{ .Values.dbPass | b64enc | quote }}
  KONY_SERVER_STORAGE_DATABASE_PASSWORD_SECRET_KEY: {{ .Values.dbPassSecretKey | b64enc | quote }}
  KONY_SERVER_TRUSTSTORE_PASSWORD: e1NlcnZlckFFU31WZ2k3SUxIWkV5OHZrVWtpSnB1bEpRPT0=
  KONY_SERVER_JMS_USER_PASSWORD: e1NlcnZlckFFU31tU2dwSVBtSWx3K1RSdnNlM3NMNW13PT0=
---
