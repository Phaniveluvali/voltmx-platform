{{ if .Values.apiPortalEnabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: voltmx-foundry-apiportal-conf
  labels:
    app.kubernetes.io/part-of: voltmx
    app.kubernetes.io/component: apiportal
    alias: apiportal
    app.kubernetes.io/name: {{ include "voltmx.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  DOCKER_PORT: "8080"
  DOCKER_HOST: {{ template "foundryBaseUrl" . }}
  FABRIC_PORT: "{{ .Values.ingress.port }}"
  HTTP_PROTOCOL: "{{ .Values.ingress.protocol }}"
  TOMCAT_SSL_ENABLED: "{{ .Values.configureTomcatWithTls }}"
  TOMACT_KEYSTORE_PATH: "/mnt/foundry-common-secrets/keystore.jks"
  TOMCAT_TLS_PROTOCOL_VERSION: "TLSv1.2"
  TOMCAT_SSL_PROTOCOL: "TLS"
  TOMCAT_KEYSTORE_TYPE: "JKS"
  TOMCAT_CONNECTOR_PROTOCOL: "HTTP/1.1"
  TOMCAT_MAX_THREADS: "200"
  TOMCAT_CONNECTION_TIMEOUT: "60000"
  APIPORTAL_LOG_LEVEL: INFO
  APIPORTAL_LOG_OPTION: console
  APIPORTAL_LOG_LOCATION: '/usr/local/logs'
  APIPORTAL_MIN_RAM_PERCENTAGE: "{{ .Values.apiportal.minRamPercentage }}"
  APIPORTAL_MAX_RAM_PERCENTAGE: "{{ .Values.apiportal.maxRamPercentage }}"
  APIPORTAL_GARBAGE_COLLECTOR_TYPE: "+UseG1GC"
  APIPORTAL_CUSTOM_JAVA_OPTS: "{{ .Values.apiportal.customJavaOpts }} {{ if .Values.enableCaCertsOverride }}-Djavax.net.ssl.trustStore=/mnt/foundry-common-secrets/cacerts -Djavax.net.ssl.trustStorePassword={{ .Values.serverTrustStorePass }}{{ end }}"
  TZ: "{{ .Values.timeZone }}"
{{ end }}