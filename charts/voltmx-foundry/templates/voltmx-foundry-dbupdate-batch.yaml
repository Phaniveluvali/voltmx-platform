apiVersion: batch/v1
kind: Job
metadata:
  name: foundry-db-update
  labels:
    app: voltmx-foundry-db
    dbjob: foundry-db-update
    app.kubernetes.io/part-of: voltmx
    app.kubernetes.io/component: dbupdate
    alias: dbupdate
    app.kubernetes.io/name: {{ include "voltmx.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-2"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        app: voltmx-foundry-db
        dbjob: foundry-db-update
        app.kubernetes.io/part-of: voltmx
        app.kubernetes.io/component: dbupdate
        alias: dbupdate
        app.kubernetes.io/name: {{ include "voltmx.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      imagePullSecrets:
      {{- if .Values.hclImagePullSecret }}
      - name: {{ .Values.hclImagePullSecret }}
      {{- end }}
      containers:
        - name: voltmx-foundry-db
          image: {{ .Values.imageRegistry }}/{{ .Values.imageNames.database }}:{{ template "resolveDbUpdateVersion" . }}
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: "RuntimeDefault"
          tty: true
          stdin: true
          envFrom:
            - configMapRef:
                name: voltmx-foundry-db-config
          volumeMounts:
            - name: foundry-db-secrets
              mountPath: "/mnt/foundry-db-secrets"
              readOnly: true
      restartPolicy: Never
      volumes:
        - name: foundry-db-secrets
          secret:
            secretName: foundry-db-secrets
  backoffLimit: 0
