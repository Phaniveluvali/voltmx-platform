{{ if .Values.engagementEnabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voltmx-foundry-engagement
  labels:
    app: voltmx-foundry-engagement
    app.kubernetes.io/part-of: voltmx
    app.kubernetes.io/component: engagement
    alias: engagement
    app.kubernetes.io/name: {{ include "voltmx.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.engagement.replicas }}
  selector:
    matchLabels:
      app: voltmx-foundry-engagement
  template:
    metadata:
      annotations:
      {{- if (.Values.annotations.pods.engagement) }}
      {{- range $customLabelValue := .Values.annotations.pods.engagement }}
        {{ $customLabelValue.key }} : {{ $customLabelValue.value | quote }}
      {{- end }}
      {{- end }}
      labels:
        app: voltmx-foundry-engagement
        app.kubernetes.io/part-of: voltmx
        app.kubernetes.io/component: engagement
        alias: engagement
        app.kubernetes.io/name: {{ include "voltmx.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      {{- if (.Values.labels.pods.engagement) }}
      {{- range $customLabelValue := .Values.labels.pods.engagement }}
        {{ $customLabelValue.key }} : {{ $customLabelValue.value | quote }}
      {{- end }}
      {{- end }}
    spec:
      imagePullSecrets:
      {{- if .Values.hclImagePullSecret }}
      - name: {{ .Values.hclImagePullSecret }}
      {{- end }}
      {{- with .Values.engagement.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if (.Values.affinity) }}
      {{- if (.Values.affinity.engagement)}}
      affinity:
        {{- toYaml (.Values.affinity.engagement) | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- if (.Values.nodeName) }}
      {{- if (.Values.nodeName.engagement)}}
      nodeName:
        {{- toYaml (.Values.nodeName.engagement) | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- if (.Values.tolerations) }}
      {{- if (.Values.tolerations.engagement)}}
      tolerations:
        {{- toYaml (.Values.tolerations.engagement) | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- if (.Values.topologySpreadConstraints) }}
      {{- if (.Values.topologySpreadConstraints.engagement)}}
      topologySpreadConstraints:
        {{- toYaml (.Values.topologySpreadConstraints.engagement) | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- if (.Values.global.hostAliases) }}
      hostAliases:
        {{- toYaml .Values.global.hostAliases | nindent 8 }}
      {{- end }}
      containers:
        - name: voltmx-foundry-engagement
          image: {{ .Values.imageRegistry }}/{{ .Values.imageNames.engagement }}:{{ template "engagementImage" . }}
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: "RuntimeDefault"
          tty: true
          stdin: true
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: voltmx-foundry-engagement-conf
          readinessProbe:
            httpGet:
              path: '/kpns/service/healthcheck/json'
              port: 8080
              httpHeaders:
                - name: Host
                  value: {{ template "foundryBaseUrl" . }}
            failureThreshold: 3
            initialDelaySeconds: {{ .Values.engagement.readinessInitDelay }}
            periodSeconds: {{ .Values.engagement.readinessPeriodSeconds }}
            successThreshold: 1
            timeoutSeconds: {{ .Values.engagement.readinessTimeoutSeconds }}
          livenessProbe:
            httpGet:
              path: '/kpns/service/healthcheck/json'
              port: 8080
              httpHeaders:
                - name: Host
                  value: {{ template "foundryBaseUrl" . }}
            failureThreshold: 3
            initialDelaySeconds: {{ .Values.engagement.livenessInitDelay }}
            periodSeconds: {{ .Values.engagement.livenessPeriodSeconds }}
            successThreshold: 1
            timeoutSeconds: {{ .Values.engagement.livenessTimeoutSeconds }}
          resources:
            limits:
              memory: {{ .Values.engagement.resourceMemoryLimit }}
              {{- if .Values.engagement.ephemeralStorageLimit }}
              ephemeral-storage: {{ .Values.engagement.ephemeralStorageLimit }}
              {{- end }}
            requests:
              memory: {{ .Values.engagement.resourceRequestsMemory }}
              {{- if .Values.engagement.ephemeralStorageRequest }}
              ephemeral-storage: {{ .Values.engagement.ephemeralStorageRequest }}
              {{- end }}
              cpu: {{ .Values.engagement.resourceRequestsCpu }}
          volumeMounts:
            - name: foundry-common-secrets
              mountPath: "/mnt/foundry-common-secrets"
              readOnly: true
            - name: engagement-dump
              mountPath: "/usr/local/tomcat/heapdumps"
      volumes:
        - name: foundry-common-secrets
          secret:
            secretName: foundry-common-secrets
        - name: engagement-dump
          emptyDir: {}
{{ end }}