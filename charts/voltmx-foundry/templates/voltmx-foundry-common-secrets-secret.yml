apiVersion: v1
kind: Secret
metadata:
  name: foundry-common-secrets
  labels:
    app.kubernetes.io/part-of: voltmx
    app.kubernetes.io/component: secrets
    alias: secrets
    app.kubernetes.io/name: {{ include "voltmx.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  DB_PASS: {{ .Values.dbPass | b64enc | quote }}
  DB_PASS_SECRET_KEY: {{ .Values.dbPassSecretKey | b64enc | quote }}
  REPORTS_DB_PASS: {{ .Values.dbPass | b64enc | quote }}
  REPORTS_DB_PASS_SECRET_KEY: {{ .Values.dbPassSecretKey | b64enc | quote }}
  {{ if .Values.enableCaCertsOverride }}cacerts: |-
    {{ .Files.Get "certs/cacerts" | b64enc }}{{ end }}
  keystore.jks: ""
  KEYSTORE_PASS: ""
  KEYSTORE_PASS_KEY: ""
---

