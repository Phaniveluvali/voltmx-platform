{{ if .Values.consoleEnabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voltmx-foundry-console
  labels:
    app: voltmx-foundry-console
    app.kubernetes.io/part-of: voltmx
    app.kubernetes.io/component: console
    alias: console
    app.kubernetes.io/name: {{ include "voltmx.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.console.replicas }}
  selector:
    matchLabels:
      app: voltmx-foundry-console
  template:
    metadata:
      annotations:
      {{- if (.Values.annotations.pods.console) }}
      {{- range $customLabelValue := .Values.annotations.pods.console }}
        {{ $customLabelValue.key }} : {{ $customLabelValue.value | quote }}
      {{- end }}
      {{- end }}
      labels:
        app: voltmx-foundry-console
        app.kubernetes.io/part-of: voltmx
        app.kubernetes.io/component: console
        alias: console
        app.kubernetes.io/name: {{ include "voltmx.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      {{- if (.Values.labels.pods.console) }}
      {{- range $customLabelValue := .Values.labels.pods.console }}
        {{ $customLabelValue.key }} : {{ $customLabelValue.value | quote }}
      {{- end }}
      {{- end }}
    spec:
      imagePullSecrets:
      {{- if .Values.hclImagePullSecret }}
      - name: {{ .Values.hclImagePullSecret }}
      {{- end }}
      {{- with .Values.console.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if (.Values.affinity) }}
      {{- if (.Values.affinity.console)}}
      affinity:
        {{- toYaml (.Values.affinity.console) | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- if (.Values.nodeName) }}
      {{- if (.Values.nodeName.console)}}
      nodeName:
        {{- toYaml (.Values.nodeName.console) | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- if (.Values.tolerations) }}
      {{- if (.Values.tolerations.console)}}
      tolerations:
        {{- toYaml (.Values.tolerations.console) | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- if (.Values.topologySpreadConstraints) }}
      {{- if (.Values.topologySpreadConstraints.console)}}
      topologySpreadConstraints:
        {{- toYaml (.Values.topologySpreadConstraints.console) | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- if (.Values.global.hostAliases) }}
      hostAliases:
        {{- toYaml .Values.global.hostAliases | nindent 8 }}
      {{- end }}
      containers:
        - name: voltmx-foundry-console
          image: {{ .Values.imageRegistry }}/{{ .Values.imageNames.console }}:{{ template "consoleImage" . }}
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: "RuntimeDefault"
          tty: true
          stdin: true
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: voltmx-foundry-console-conf
          readinessProbe:
            httpGet:
              path: '/mfconsole/health_check'
              port: 8080
              httpHeaders:
                - name: Host
                  value: {{ template "foundryBaseUrl" . }}
            failureThreshold: 3
            initialDelaySeconds: {{ .Values.console.readinessInitDelay }}
            periodSeconds: {{ .Values.console.readinessPeriodSeconds }}
            successThreshold: 1
            timeoutSeconds: {{ .Values.console.readinessTimeoutSeconds }}
          livenessProbe:
            httpGet:
              path: '/mfconsole/health_check'
              port: 8080
              httpHeaders:
                - name: Host
                  value: {{ template "foundryBaseUrl" . }}
            failureThreshold: 3
            initialDelaySeconds: {{ .Values.console.livenessInitDelay }}
            periodSeconds: {{ .Values.console.livenessPeriodSeconds }}
            successThreshold: 1
            timeoutSeconds: {{ .Values.console.livenessTimeoutSeconds }}
          resources:
            limits:
              memory: {{ .Values.console.resourceMemoryLimit }}
              {{- if .Values.console.ephemeralStorageLimit }}
              ephemeral-storage: {{ .Values.console.ephemeralStorageLimit }}
              {{- end }}
            requests:
              memory: {{ .Values.console.resourceRequestsMemory }}
              {{- if .Values.console.ephemeralStorageRequest }}
              ephemeral-storage: {{ .Values.console.ephemeralStorageRequest }}
              {{- end }}
              cpu: {{ .Values.console.resourceRequestsCpu }}
          volumeMounts:
            - name: foundry-common-secrets
              mountPath: "/mnt/foundry-common-secrets"
              readOnly: true
            - name: console-dump
              mountPath: "/usr/local/tomcat/heapdumps"
      volumes:
        - name: foundry-common-secrets
          secret:
            secretName: foundry-common-secrets
        - name: console-dump
          emptyDir: {}
{{ end }}