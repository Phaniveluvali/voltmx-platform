{{ if .Values.apiPortalEnabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voltmx-foundry-apiportal
  labels:
    app: voltmx-foundry-apiportal
    app.kubernetes.io/part-of: voltmx
    app.kubernetes.io/component: apiportal
    alias: apiportal
    app.kubernetes.io/name: {{ include "voltmx.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.apiportal.replicas }}
  selector:
    matchLabels:
      app: voltmx-foundry-apiportal
  template:
    metadata:
      annotations:
      {{- if (.Values.annotations.pods.apiPortal) }}
      {{- range $customLabelValue := .Values.annotations.pods.apiPortal }}
        {{ $customLabelValue.key }} : {{ $customLabelValue.value | quote }}
      {{- end }}
      {{- end }}
      labels:
        app: voltmx-foundry-apiportal
        app.kubernetes.io/part-of: voltmx
        app.kubernetes.io/component: apiportal
        alias: apiportal
        app.kubernetes.io/name: {{ include "voltmx.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      {{- if (.Values.labels.pods.apiPortal) }}
      {{- range $customLabelValue := .Values.labels.pods.apiPortal }}
        {{ $customLabelValue.key }} : {{ $customLabelValue.value | quote }}
      {{- end }}
      {{- end }}
    spec:
      imagePullSecrets:
      {{- if .Values.hclImagePullSecret }}
      - name: {{ .Values.hclImagePullSecret }}
      {{- end }}
      {{- with .Values.apiportal.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if (.Values.affinity) }}
      {{- if (.Values.affinity.apiPortal)}}
      affinity:
        {{- toYaml (.Values.affinity.apiPortal) | nindent 8 }}
      {{- end }}
      {{- end }} 
      {{- if (.Values.nodeName) }}
      {{- if (.Values.nodeName.apiPortal)}}
      nodeName: {{ (.Values.nodeName.apiPortal) }}
      {{- end }}
      {{- end }}
      {{- if (.Values.tolerations) }}
      {{- if (.Values.tolerations.apiPortal)}}
      tolerations:
        {{- toYaml (.Values.tolerations.apiPortal) | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- if (.Values.topologySpreadConstraints) }}
      {{- if (.Values.topologySpreadConstraints.apiPortal)}}
      topologySpreadConstraints:
        {{- toYaml (.Values.topologySpreadConstraints.apiPortal) | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- if (.Values.global.hostAliases) }}
      hostAliases:
        {{- toYaml .Values.global.hostAliases | nindent 8 }}
      {{- end }}
      containers:
        - name: voltmx-foundry-apiportal
          image: {{ .Values.imageRegistry }}/{{ .Values.imageNames.apiPortal }}:{{ template "apiportalImage" . }}
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: "RuntimeDefault"
          tty: true
          stdin: true
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: voltmx-foundry-apiportal-conf
          readinessProbe:
            httpGet:
              path: '/apiportal/healthcheck'
              port: 8080
              httpHeaders:
                - name: Host
                  value: {{ template "foundryBaseUrl" . }}
            failureThreshold: 3
            initialDelaySeconds: {{ .Values.apiportal.readinessInitDelay }}
            periodSeconds: {{ .Values.apiportal.readinessPeriodSeconds }}
            successThreshold: 1
            timeoutSeconds: {{ .Values.apiportal.readinessTimeoutSeconds }}
          livenessProbe:
            httpGet:
              path: '/apiportal/healthcheck'
              port: 8080
              httpHeaders:
                - name: Host
                  value: {{ template "foundryBaseUrl" . }}
            failureThreshold: 3
            initialDelaySeconds: {{ .Values.apiportal.livenessInitDelay }}
            periodSeconds: {{ .Values.apiportal.livenessPeriodSeconds }}
            successThreshold: 1
            timeoutSeconds: {{ .Values.apiportal.livenessTimeoutSeconds }}
          resources:
            limits:
              memory: {{ .Values.apiportal.resourceMemoryLimit }}
              {{- if .Values.apiportal.ephemeralStorageLimit }}
              ephemeral-storage: {{ .Values.apiportal.ephemeralStorageLimit }}
              {{- end }}
            requests:
              memory: {{ .Values.apiportal.resourceRequestsMemory }}
              {{- if .Values.apiportal.ephemeralStorageRequest }}
              ephemeral-storage: {{ .Values.apiportal.ephemeralStorageRequest }}
              {{- end }}
              cpu: {{ .Values.apiportal.resourceRequestsCpu }}
          volumeMounts:
            - name: foundry-common-secrets
              mountPath: "/mnt/foundry-common-secrets"
              readOnly: true
            - name: apiportal-dump
              mountPath: "/usr/local/tomcat/heapdumps"
      volumes:
        - name: foundry-common-secrets
          secret:
            secretName: foundry-common-secrets
        - name: apiportal-dump
          emptyDir: {}
{{ end }}