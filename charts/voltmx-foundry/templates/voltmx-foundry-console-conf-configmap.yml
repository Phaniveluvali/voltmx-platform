{{ if .Values.consoleEnabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: voltmx-foundry-console-conf
  labels:
    app.kubernetes.io/part-of: voltmx
    app.kubernetes.io/component: console
    alias: console
    app.kubernetes.io/name: {{ include "voltmx.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  DOCKER_PORT: "8080"
  DOCKER_HOST: {{ template "foundryBaseUrl" . }}
  FABRIC_PORT: "{{ .Values.ingress.port }}"
  HTTP_PROTOCOL: "{{ .Values.ingress.protocol }}"
  TOMCAT_TLS_PROTOCOL_VERSION: "TLSv1.2"
  TOMCAT_SSL_PROTOCOL: "TLS"
  TOMCAT_KEYSTORE_TYPE: "JKS"
  TOMCAT_CONNECTOR_PROTOCOL: "HTTP/1.1"
  TOMCAT_MAX_THREADS: "200"
  TOMCAT_CONNECTION_TIMEOUT: "60000"
  TOMCAT_SSL_ENABLED: "{{ .Values.configureTomcatWithTls }}"
  ACCOUNTS_DB_PORT: "{{ .Values.dbPort }}"
  ACCOUNTS_DB_JNDI: jdbc/konyaccounts
  REPORTS_DB_JNDI: jdbc/konyreports
  DB_SQL_DIALECT: {{ template "dbDialect" . }}
  DB_CONNECTION_ISOLATION_LEVEL: "2"
  DB_SQL_SHOW: "false"
  DB_SQL_USE_SCROLLABLE_RESULTSET: "true"
  ACCOUNTS_ENCRYPTION_KEY: {{ required "The property accountsEncryptionKey is required. This should be initialized with the script init-guids.sh. Please run init-guids.sh." .Values.accountsEncryptionKey | quote }}
  ACCOUNTS_DB_HOST: {{ template "resolveDbHostName" . }}
  ACCOUNTS_DB_USER: {{ template "mfaccountsdb_user_name" . }}
  ACCOUNTS_DB_MAX_ACTIVE_DBC: "5"
  ACCOUNTS_DB_MAX_WAIT: "10000"
  ACCOUNTS_DB_MAX_IDLE: "5"
  ACCOUNTS_DB_MIN_IDLE: "2"
  KONY_ACCOUNTS_DB: {{ template "mfaccountsdbname" . }}
  KONY_REPORTS_DB: {{ template "mfreportsdbname" . }}
  REPORTS_DB_MAX_ACTIVE_DBC: "5"
  REPORTS_DB_MAX_WAIT: "10000"
  REPORTS_DB_MAX_IDLE: "5"
  REPORTS_DB_MIN_IDLE: "2"
  KONY_MF_CONSOLE_DB: {{ template "mfconsoledbname" . }}
  WAAS_MASTER_KEY: {{ required "The property waasMasterKey is required. This should be initialized with the script init-guids.sh. Please run init-guids.sh." .Values.waasMasterKey | quote }}
  WAAS_MASTER_KEY_ID: {{ required "The property waasMasterKeyId is required. This should be initialized with the script init-guids.sh. Please run init-guids.sh." .Values.waasMasterKeyId | quote }}
  WAAS_RDS_DB_TYPE: {{ template "db_choice" . }}
  WAAS_DB_NAME: {{ template "mfconsoledbname" . }}
  WAAS_DB_HOST: {{ template "resolveDbHostName" . }}
  WAAS_RDS_PORT: "{{ .Values.dbPort }}"
  WAAS_LOG_LEVEL: INFO
  WAAS_LOG_OPTION: console
  WAAS_LOG_LOCATION: '/usr/local/logs'
  WAAS_MAX_ACTIVE_DBC: "25"
  WAAS_MAX_IDLE: "5"
  WAAS_MIN_IDLE: "5"
  WAAS_MAX_WAIT: "120000"
  WORKSPACE_GLOBAL_DB_MAX_ACTIVE_DBC: "5"
  WORKSPACE_GLOBAL_DB_MAX_IDLE: "5"
  WORKSPACE_GLOBAL_DB_MIN_IDLE: "5"
  WORKSPACE_GLOBAL_DB_MAX_WAIT: "120000"
  WAAS_APPSERVER_TYPE: TOMCAT
  WAAS_ENCRYPTION_KEY: 3bcf2351-a3e5-44b3-ac06-ff1bd5f738cd
  WAAS_hibernate.dialect: {{ template "dbDialect" . }}
  WAAS_ISOLATION_LEVEL: "2"
  CONSOLE_UI_ACCOUNTS_URLS: "false"
  CONSOLE_VERSION: {{ .Values.foundryBuildVer }}
  CONSOLE_HOME: '/usr/local/console_home/'
  WAASDB_URL: {{ template "waasDbUrl" . }}
  WAAS_DB_USER: {{ template "mfconsoledb_user_name" . }}
  REPORTS_DB_USER: {{ template "mfreportsdb_user_name" . }}
  DB_DRIVER: {{ template "dbDriver" . }}
  VALIDATION_QUERY: {{ template "dbValidationQuery" . }}
  ACCOUNTSDB_URL: {{ template "accountsDbUrl" . }}
  REPORTSDB_URL: {{ template "reportsDbUrl" . }}
  CONSOLE_MIN_RAM_PERCENTAGE: "{{ .Values.console.minRamPercentage }}"
  CONSOLE_MAX_RAM_PERCENTAGE: "{{ .Values.console.maxRamPercentage }}"
  CONSOLE_GARBAGE_COLLECTOR_TYPE: "+UseG1GC"
  CONSOLE_CUSTOM_JAVA_OPTS: "{{ .Values.console.customJavaOpts }} {{ if .Values.enableCaCertsOverride }}-Djavax.net.ssl.trustStore=/mnt/foundry-common-secrets/cacerts -Djavax.net.ssl.trustStorePassword={{ .Values.serverTrustStorePass }}{{ end }}"
  TZ: "{{ .Values.timeZone }}"
{{ end }}