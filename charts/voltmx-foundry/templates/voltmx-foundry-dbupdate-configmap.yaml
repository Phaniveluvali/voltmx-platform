  #WAAS
  WAAS_LOG_LOCATION: /usr/local/logs
  WAAS_LOG_LEVEL: INFO
  WAAS_LOG_OPTION: console
  WAAS_DATA_TABLESPACE: '{{ .Values.dbDataTS }}'
  WAAS_INDEX_TABLESPACE: '{{ .Values.dbIndexTS }}'
  WAAS_LOB_TABLESPACE: '{{ .Values.dbLobTS }}'
  CONSOLE_ENABLED: '{{ template "resolveDbUpdateIncludeConsole" . }}'
  WAAS_MASTER_KEY: {{ required "The property waasMasterKey is required. This should be initialized with the script init-guids.sh. Please run init-guids.sh." .Values.waasMasterKey | quote }}

  #ACCOUNTS
  ACCOUNTS_LOG_LOCATION: /usr/local/logs
  ACCOUNTS_LOG_OPTION: console
  ACCOUNTS_LOG_LEVEL: INFO
  COM_PROTOCOL: {{ .Values.ingress.protocol }}
  DISP_APP_SERVER: tomcat
  DISP_DB_CHOICE: {{ template "db_choice" . }}
  DISP_INSTALLATION_CHOICE: New Installation
  DISP_INSTALL_MODE: Standalone Mode
  ONE_BOX_SETUP: 'true'
  PREINSTALL_DB_NAME_LIST: {{ template "preInstallDbNameList" . }}
  PRODUCT_VERSION_NUMBER: {{ .Values.foundryBuildVer }}
  SELECTED_COMP: "Console, Developer Portal Services, Identity Services, Integration Services and Engagement Services"
  USER_INSTALL_DIR: /KF
  WAAS_BASE_URL: {{ template "waasBaseUrl" .}}
  ACCOUNTS_LOGGER_JNDI: java:comp/env/jdbc/konyaccounts
  ACCOUNTS_INDEX_TABLESPACE: '{{ .Values.dbIndexTS }}'
  ACCOUNTS_LOB_TABLESPACE: '{{ .Values.dbLobTS }}'
  ACCOUNTS_DATA_TABLESPACE: '{{ .Values.dbDataTS }}'

  #Admin
  KONY_SERVER_STORAGE_DATABASE_TYPE: {{ .Values.dbType }}
  KONY_SERVER_STORAGE_DATABASE_HOSTNAME: {{ template "resolveDbHostName" . }}
  KONY_SERVER_STORAGE_DATABASE_PORT: '{{ .Values.dbPort }}'
  KONY_SERVER_STORAGE_DATABASE_USERNAME: '{{ .Values.dbUser }}'
  KONY_SERVER_STORAGE_DATABASE_INSTANCE: '{{ .Values.dbService }}'
  KONY_SERVER_RICH_CLIENT_DEPLOY: lib/apps
  KONY_SERVER_CACHEID_TRANSPORT: PARAM_ONLY
  KONY_SERVER_TRUSTSTORE_LOCATION: '{{ template "trustStoreLocation" . }}'
  KONY_SERVER_KEYSTORE_LOCATION: /usr/local/openjdk-11/lib/security/cacerts
  KONY_SERVER_SSL_SOCKETFACTORY_PROVIDER: sun.security.ssl.SSLSocketFactoryImpl
  KONY_SERVER_SSL_SERVERSOCKETFACTORY_PROVIDER: sun.security.ssl.SSLServerSocketFactoryImpl
  KONY_SERVER_JMS_INITIAL_CONTEXT_FACTORY: org.apache.activemq.jndi.ActiveMQInitialContextFactory
  KONY_SERVER_JMS_PROVIDER_URL: tcp://localhost:61616?jms.useAsyncSend=TRUE
  KONY_SERVER_JMS_USER_NAME: admin
  KONY_SERVER_LOG_LOCATION: /usr/local/logs
  KONY_SERVER_LOGGER_JNDI_NAME: java:comp/env/jdbc/konyadmindb
  KONY_SERVER_SHOW_ENVIRONMENT_MONITORING_DATA: 'true'
  KONY_SERVER_LOG_OPTION: console
  MANAGEMENT_SERVER_USER: manager
  MANAGEMENT_SERVER_SCHEME: {{ .Values.ingress.protocol }}
  MANAGEMENT_SERVER_HOST_NAME: {{ template "foundryBaseUrl" .}}
  MANAGEMENT_SERVER_PORT: "80"
  KONY_SERVER_LOB_TABLESPACE: '{{ .Values.dbLobTS }}'
  KONY_SERVER_DATA_TABLESPACE: '{{ .Values.dbDataTS }}'
  KONY_SERVER_INDEX_TABLESPACE: '{{ .Values.dbIndexTS }}'
  SERVER_TOPIC_CONNECTION_FACTORY: 'ConnectionFactory'
  KONY_SERVER_SESSION_DISTRIBUTED: 'false'
  KONY_SERVER_CACHE_TYPE: 'EHCACHE'
  KONY_SERVER_CACHE_URL: ''
  KONY_SERVER_SHARED_LIB_NAME: ''
  MANAGEMENT_SERVER_GROUPS: ''
  MANAGEMENT_SERVER_KEYSTORE_FILENAME: ''
  MANAGEMENT_SERVER_KEYSTORE_PASSWORD: ''
  MANAGEMENT_SERVER_TRUSTSTORE_FILENAME: ''
  MANAGEMENT_SERVER_TRUSTSTORE_PASSWORD: ''
  SERVER_CONSOLE_REDIRECT_IP: ''
  SERVER_CONSOLE_REDIRECT_PORT: ''
  KONY_SERVER_MEMCACHE_CLUSTER: ''
  KONY_SERVER_MEMCACHED_COUNT: ''
  INTEGRATION_ENABLED: '{{ template "resolveDbUpdateIncludeIntegration" . }}'

  #REPORTS
  KONY_METRICS_LOGGER_JNDI: 'java:comp/env/jdbc/konyreports'
  KONY_METRICS_LOG_LOCATION: /usr/local/logs
  KONY_METRICS_LOG_LEVEL: INFO
  KONY_METRICS_LOG_OPTION: console
  METRICS_DATA_TABLESPACE: '{{ .Values.dbDataTS }}'
  METRICS_LOB_TABLESPACE: '{{ .Values.dbLobTS }}'
  METRICS_INDEX_TABLESPACE: '{{ .Values.dbIndexTS }}'

  #KPNS
  KMS_DATA_TABLESPACE: '{{ .Values.dbDataTS }}'
  KMS_INDEX_TABLESPACE: '{{ .Values.dbIndexTS }}'
  KMS_LOB_TABLESPACE: '{{ .Values.dbLobTS }}'
  KONY_ENGAGEMENT_LOG_OPTION: console
  KONY_ENGAGEMENT_LOG_LOCATION: '/usr/local/logs'
  KONY_ENGAGEMENT_LOG_LEVEL: 'ERROR'
  MESSAGING_ENABLED: '{{ template "resolveDbUpdateIncludeMessaging" . }}'

  #Timezone
  TZ: "{{ .Values.timeZone }}"

  #Perform Repair Database
  PERFORM_FLYWAY_REPAIR: "{{ .Values.useExistingDb }}"
  INSTALL_ENV_NAME: "{{ .Values.installEnvName }}"
  DB_DIALECT: {{ template "dbDialect" . }}
