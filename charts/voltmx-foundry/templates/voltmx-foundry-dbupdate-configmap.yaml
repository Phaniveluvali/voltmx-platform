  AUTH_LOG_OPTION: console
  AUTH_LOG_LEVEL: INFO
  AUTH_LOB_TABLESPACE: '{{ .Values.dbLobTS }}'
  AUTH_INDEX_TABLESPACE: '{{ .Values.dbIndexTS }}'
  AUTH_DATA_TABLESPACE: '{{ .Values.dbDataTS }}'
  IDENTITY_ENABLED: '{{ template "resolveDbUpdateIncludeIdentity" . }}'
