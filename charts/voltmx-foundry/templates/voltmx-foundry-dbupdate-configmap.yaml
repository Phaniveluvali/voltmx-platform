apiVersion: v1
kind: ConfigMap
metadata:
  name: voltmx-foundry-db-config
  labels:
    app.kubernetes.io/part-of: voltmx
    app.kubernetes.io/component: dbupdate
    alias: dbupdate
    app.kubernetes.io/name: {{ include "voltmx.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-3"
    "helm.sh/hook-delete-policy": before-hook-creation,post-install
data:
  #-------------------------------------
  DB_TYPE: '{{ template "fabric_db_type" . }}'
  DB_NAME_PREFIX: '{{ .Values.dbPrefix }}'
  DB_NAME_SUFFIX: '{{ .Values.dbSuffix }}'
  DB_HOST: '{{ template "resolveDbHostName" . }}'
  DB_PORT: '{{ .Values.dbPort }}'
  DB_USER: '{{ .Values.dbUser }}'
  DB_SERVICE: '{{ .Values.dbService }}'
  DB_CONNECTION_PARAMS: '{{ template "mySQLConnectionParms" . }}'
  DB_INSTANCE: '{{ .Values.DB_INSTANCE }}'
  DB_DATA_TS: '{{ .Values.dbDataTS }}'
  DB_INDEX_TS: '{{ .Values.dbIndexTS }}'
  DB_LOB_TS: '{{ .Values.dbLobTS }}'
  DB_COLLATION_NAME: 'SQL_Latin1_General_CP1_CI_AS'
  DB_DRIVER: {{ template "dbDriver" . }}
  IS_MYSQL_CLUSTER: '{{ template "isMySQLCluster" . }}'

  #Version
  FABRIC_VERSION: {{ .Values.foundryBuildVer }}

  #AUTH
  # whether production or development
  FABRIC_INSTALL_TYPE: {{ required "The property foundryInstallType is required. Please review your values.yaml." .Values.foundryInstallType | quote }}
