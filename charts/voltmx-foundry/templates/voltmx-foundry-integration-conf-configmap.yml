{{ if .Values.integrationEnabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: voltmx-foundry-integration-conf
  labels:
    app.kubernetes.io/part-of: voltmx
    app.kubernetes.io/component: integration
    alias: integration
    app.kubernetes.io/name: {{ include "voltmx.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  DOCKER_PORT: "8080"
  DOCKER_HOST: {{ template "foundryBaseUrl" . }}
  FABRIC_PORT: "{{ .Values.ingress.port }}"
  HTTP_PROTOCOL: "{{ .Values.ingress.protocol }}"
  TOMCAT_SSL_ENABLED: "{{ .Values.configureTomcatWithTls }}"
  TOMACT_KEYSTORE_PATH: "/mnt/foundry-common-secrets/keystore.jks"
  TOMCAT_TLS_PROTOCOL_VERSION: "TLSv1.2"
  TOMCAT_SSL_PROTOCOL: "TLS"
  TOMCAT_KEYSTORE_TYPE: "JKS"
  TOMCAT_CONNECTOR_PROTOCOL: "HTTP/1.1"
  TOMCAT_MAX_THREADS: "200"
  TOMCAT_CONNECTION_TIMEOUT: "60000"
  SSL_ENABLED: "false"
  ADMIN_DB_USER: {{ template "admindb_user_name" . }}
  ADMIN_DB_HOST: {{ template "resolveDbHostName" . }}
  ADMIN_DB_PORT: "{{ .Values.dbPort }}"
  ADMIN_DB_NAME: {{ template "admindbname" . }}
  ADMIN_DB_MAX_ACTIVE_DBC: "5"
  ADMIN_DB_MAX_IDLE: "5"
  ADMIN_DB_MAX_WAIT: "10000"
  ADMIN_DB_MIN_IDLE: "2"
  KONY_REPORTS_DB_NAME: {{ template "mfreportsdbname" . }}
  METRICS_DB_JNDI_NAME: jdbc/konyreports
  ADMINDB_URL: {{ template "adminDbUrl" . }}
  REPORTSDB_URL: {{ template "reportsDbUrl" . }}
  ADMINDB_DIALECT: {{ template "adminDbDialect" . }}
  DB_DRIVER: {{ template "dbDriver" . }}
  REPORTS_DB_USER: {{ template "mfreportsdb_user_name" . }}
  REPORTS_DB_MAX_ACTIVE_DBC: "5"
  REPORTS_DB_MAX_WAIT: "10000"
  REPORTS_DB_MAX_IDLE: "5"
  REPORTS_DB_MIN_IDLE: "2"
  DB_TYPE: {{ template "admin_db_type" . }}
  VALIDATION_QUERY: {{ template "dbValidationQuery" . }}
  INTEGRATION_MIN_RAM_PERCENTAGE: "{{ .Values.integration.minRamPercentage }}"
  INTEGRATION_MAX_RAM_PERCENTAGE: "{{ .Values.integration.maxRamPercentage }}"
  INTEGRATION_GARBAGE_COLLECTOR_TYPE: "+UseG1GC"
  INTEGRATION_CUSTOM_JAVA_OPTS: "{{ .Values.integration.customJavaOpts }} {{ if .Values.enableCaCertsOverride }}-Djavax.net.ssl.trustStore=/mnt/foundry-common-secrets/cacerts -Djavax.net.ssl.trustStorePassword={{ .Values.serverTrustStorePass }}{{ end }}"
  TZ: "{{ .Values.timeZone }}"
  ENABLE_REDIS_SSL: "false"
{{ end }}