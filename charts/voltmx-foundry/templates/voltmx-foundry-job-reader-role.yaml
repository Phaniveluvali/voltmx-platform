---
# Add privileges to Service Account enabling pods to check on status of db update job
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: readonly
  labels:
    app.kubernetes.io/part-of: voltmx
    app.kubernetes.io/component: integration
    alias: integration
    app.kubernetes.io/name: {{ include "voltmx.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: ["batch", "", "networking.k8s.io"]
    resources: ["jobs", "pods", "ingresses"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: get-job-status
  labels:
    app.kubernetes.io/part-of: voltmx
    app.kubernetes.io/component: integration
    alias: integration
    app.kubernetes.io/name: {{ include "voltmx.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ default "default" .Values.deploymentServiceAccount }}
roleRef:
  kind: Role
  name: readonly
  apiGroup: rbac.authorization.k8s.io